# ========================================================
# RescueSync Web Backend Configuration
# Spring Boot + MariaDB + Hibernate
# ========================================================

# Server Configuration
server.port=8080
spring.application.name=RescueSync-Backend


# ========================================================
# MariaDB Database Configuration
# ========================================================

spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rescuesync_db}?sslMode=disable&serverTimezone=UTC&characterEncoding=UTF-8

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


# ========================================================
# Hikari Connection Pool
# ========================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000


# ========================================================
# Hibernate / JPA Configuration
# ========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# ========================================================
# Logging Configuration
# ========================================================

logging.level.org.springframework.web=INFO
logging.level.com.rescuesync=INFO


# ========================================================
# JWT Configuration
# ========================================================

app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}